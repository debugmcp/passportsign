# passportsign hosted surface (roadmap v0.5.4).
#
# First deploys go to <name>.workers.dev. Once the passportsign.dev
# zone is on Cloudflare, uncomment the routes below — everything not
# matched by a route keeps passing through to GitHub Pages, which
# continues to serve the landing page and /index/* operator overlay.

name = "passportsign-web"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# The Vite-built browser app (/bind). Static assets are served first
# for matching GET paths; /badge/* and /verify/* have no assets, so
# they fall through to the Worker. Run `pnpm build` before deploy.
[assets]
directory = "dist-app"

# routes = [
#   { pattern = "passportsign.dev/badge/*", zone_name = "passportsign.dev" },
#   { pattern = "passportsign.dev/verify/*", zone_name = "passportsign.dev" },
# ]
